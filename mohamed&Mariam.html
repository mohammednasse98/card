/* إضافات شكل الظرف الدائري فقط — باقي الكود كما هو */
/*
  أضف هذا الكود في نهاية وسم <style> الحالي.
  لا يحتاج إلى تعديل HTML أو JavaScript.
*/
​
/* خلفية هادئة وعنوان الدعوة من غير إضافة HTML جديد */
#intro{
  gap:26px;
  padding:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,255,255,.78),transparent 31%),
    linear-gradient(160deg,#fff9f6 0%,#f7e7df 55%,#edcfc1 100%);
  isolation:isolate;
}
​
#intro::before{
  content:"";
  position:absolute;
  z-index:-2;
  left:50%;
  top:50%;
  width:min(540px,88vw);
  aspect-ratio:1;
  border:1.5px solid rgba(199,154,85,.38);
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:
    0 0 0 38px rgba(199,154,85,.055),
    0 0 0 76px rgba(199,154,85,.035);
  animation:circleBreath 6s ease-in-out infinite;
}
​
#intro::after{
  content:"دعوة زفاف";
  position:absolute;
  z-index:2;
  top:calc(50% - min(255px,42vw));
  left:50%;
  width:max-content;
  transform:translateX(-50%);
  color:var(--choc,#3a1409);
  font:700 clamp(1.55rem,5vw,2rem) 'Aref Ruqaa',serif;
  text-shadow:0 3px 16px rgba(58,20,9,.1);
}
​
/* تحويل الظرف إلى شكل أفقي ومتوازن مثل الصورة */
.env{
  width:min(350px,82vw);
  aspect-ratio:3/2;
  margin:38px 0 0;
  border-radius:10px;
  filter:drop-shadow(0 24px 24px rgba(58,20,9,.28));
  animation:envelopeFloat 5s ease-in-out infinite;
}
​
.env-back,
.env-front{
  border-radius:10px;
}
​
.env-front{
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  background:linear-gradient(155deg,#6a301d 0%,#46180d 52%,#2d0d06 100%);
}
​
.env-flap{
  height:62%;
  border-radius:10px 10px 0 0;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,#743822 0%,#4b1b0f 100%);
}
​
/* الختم في منتصف التقاء الظرف */
.seal{
  top:58%;
  width:64px;
  height:64px;
  margin:-32px 0 0 -32px;
  border:2px solid rgba(255,241,215,.75);
  background:radial-gradient(circle at 34% 28%,#f1d99f 0%,#c79a55 58%,#8a6027 100%);
  box-shadow:
    0 7px 18px rgba(58,20,9,.35),
    inset 0 1px 2px rgba(255,255,255,.7);
}
​
.seal::before{
  inset:6px;
  border-color:rgba(255,246,226,.65);
}
​
/* الحفاظ على النص الموجود داخل كودك */
.env-text{
  bottom:8%;
}
​
.env-text b{
  font-size:1.7rem;
}
​
.env-text span{
  margin-top:1px;
  font-size:1.1rem;
}
​
/* تصغير البوكيه ليلائم الظرف الأفقي */
.bouquet{
  top:-54px;
  right:7%;
  width:35%;
}
​
.intro-hint{
  margin-top:2px;
  color:rgba(58,20,9,.62);
  font-size:1rem;
  animation:hintPulse 2.5s ease-in-out infinite;
}
​
@keyframes circleBreath{
  0%,100%{transform:translate(-50%,-50%) scale(.97);opacity:.75}
  50%{transform:translate(-50%,-50%) scale(1.03);opacity:1}
}
​
@keyframes envelopeFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
​
@keyframes hintPulse{
  0%,100%{opacity:.58}
  50%{opacity:1}
}
​
@media(max-width:390px){
  #intro{padding:18px;gap:22px}
​
  #intro::before{
    width:92vw;
    box-shadow:
      0 0 0 24px rgba(199,154,85,.05),
      0 0 0 48px rgba(199,154,85,.028);
  }
​
  #intro::after{
    top:calc(50% - 205px);
    font-size:1.55rem;
  }
​
  .env{
    width:min(330px,86vw);
    margin-top:34px;
  }
​
  .seal{
    width:58px;
    height:58px;
    margin:-29px 0 0 -29px;
  }
}
​
@media(prefers-reduced-motion:reduce){
  #intro::before,
  .env,
  .intro-hint{
    animation:none!important;
  }
}
​
</style>

<script>
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
$('bride').textContent=$('fBride').textContent=CONFIG.bride;$('groom').textContent=$('fGroom').textContent=CONFIG.groom;$('sealLetters').innerHTML=`${CONFIG.bride[0]}<i>&</i>${CONFIG.groom[0]}`;document.title=`دعوة زفاف ${CONFIG.bride} و ${CONFIG.groom}`;
const dateStr=`${CONFIG.dayName} ${CONFIG.dateText}`.trim();if(dateStr)$('date').textContent=dateStr;else $('date').hidden=true;$('time').textContent=CONFIG.timeText;$('hall').textContent=$('venue').textContent=CONFIG.venue;$('venueLink').href=CONFIG.mapsLink;$('rsvpDate').textContent=dateStr;if(String(CONFIG.whatsapp).replace(/\D/g,''))$('rsvp').hidden=false;
if(CONFIG.countdownTo){const target=new Date(CONFIG.countdownTo).getTime();if(!Number.isNaN(target)){$('countSection').hidden=false;const pad=n=>String(n).padStart(2,'0');let timer;const tick=()=>{const s=Math.floor((target-Date.now())/1000);if(s<=0){$('countdown').innerHTML='<div class="count-done">الفرح النهارده — نورونا</div>';clearInterval(timer);return}$('cd').textContent=Math.floor(s/86400);$('ch').textContent=pad(Math.floor(s%86400/3600));$('cm').textContent=pad(Math.floor(s%3600/60));$('cse').textContent=pad(s%60)};timer=setInterval(tick,1000);tick()}}
const audio=$('song');audio.src=CONFIG.songFile;audio.loop=!CONFIG.songEnd;audio.addEventListener('loadedmetadata',()=>{if(CONFIG.songStart)audio.currentTime=CONFIG.songStart});audio.addEventListener('timeupdate',()=>{if(CONFIG.songEnd&&audio.currentTime>=CONFIG.songEnd)audio.currentTime=CONFIG.songStart});audio.addEventListener('play',()=>$('play').classList.add('on'));audio.addEventListener('pause',()=>$('play').classList.remove('on'));$('play').onclick=()=>{audio.muted=false;$('sound').classList.remove('muted');audio.paused?audio.play().catch(()=>{}):audio.pause()};$('sound').onclick=e=>{audio.muted=!audio.muted;e.currentTarget.classList.toggle('muted',audio.muted)};let resume=false;document.addEventListener('visibilitychange',()=>{if(!document.body.classList.contains('open'))return;if(document.hidden){resume=!audio.paused;if(resume)audio.pause()}else if(resume){audio.play().catch(()=>{});resume=false}});
function buildFlora(){const H=$('hero').offsetHeight,ns='http://www.w3.org/2000/svg',L=$('floraL'),R=$('floraR');[L,R].forEach(s=>{s.setAttribute('viewBox',`0 0 72 ${H}`);s.innerHTML=''});const add=(tag,a)=>{const e=document.createElementNS(ns,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));L.appendChild(e)};for(let y=-10;y<H+10;y+=rnd(13,20)){const x=rnd(3,23),cx=x+rnd(8,34),cy=y+rnd(-5,5);add('path',{d:`M${x} ${y} Q${(x+cx)/2} ${cy-8} ${cx} ${cy}`,stroke:'#8c9c7e','stroke-width':.8,fill:'none',opacity:.8});for(let k=0;k<3;k++)add('circle',{cx:cx+rnd(-7,7),cy:cy+rnd(-7,7),r:rnd(1.7,3.4),fill:Math.random()<.8?'#fffdf9':'#efc9bd'})}R.innerHTML=L.innerHTML}
function petals(){const hero=$('hero');if(hero.dataset.petalsReady)return;hero.dataset.petalsReady='1';const f=document.createDocumentFragment();for(let i=0;i<12;i++){const p=document.createElement('span');p.className='petal'+(i%4===0?' g':'');p.style.left=rnd(3,97)+'%';p.style.setProperty('--dx',rnd(-45,45)+'px');p.style.animationDuration=rnd(10,17)+'s';p.style.animationDelay=-rnd(0,14)+'s';f.appendChild(p)}hero.appendChild(f)}
function drawMap(){const cv=$('map'),W=320,H=190,dpr=Math.min(devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);g.fillStyle='#4a1a0d';const blobs=[[42,55,36,20],[75,72,25,16],[93,120,16,34],[155,67,25,18],[175,105,18,39],[220,61,58,19],[260,90,35,20],[285,130,28,16]];blobs.forEach(([cx,cy,rx,ry])=>{for(let x=cx-rx;x<=cx+rx;x+=5)for(let y=cy-ry;y<=cy+ry;y+=5)if(((x-cx)/rx)**2+((y-cy)/ry)**2<1&&Math.random()>.16){g.beginPath();g.arc(x,y,1.55,0,Math.PI*2);g.fill()}});$('mpin').style.left='58%';$('mpin').style.top='38%'}drawMap();
function observe(){const els=document.querySelectorAll('.reveal:not(.in)');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});els.forEach((e,i)=>{e.style.transitionDelay=(i<10?i*.12:0)+'s';io.observe(e)})}
let opened=false,revealed=false;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;$('env').onclick=()=>{if(opened)return;opened=true;$('env').classList.add('opened');$('env').disabled=true;audio.play().catch(()=>{});setTimeout(()=>{document.body.classList.add('open','lock');$('intro').classList.add('gone');scrollTo(0,0);if(!revealed){buildFlora();petals();revealed=true}setTimeout(()=>{document.body.classList.remove('lock');observe()},reduce?100:3200)},reduce?100:1200)};
document.querySelectorAll('.opt').forEach(b=>{b.setAttribute('aria-pressed','false');b.onclick=()=>{document.querySelectorAll(`.opt[data-g="${b.dataset.g}"]`).forEach(o=>{o.classList.remove('sel');o.setAttribute('aria-pressed','false')});b.classList.add('sel');b.setAttribute('aria-pressed','true');$('err').textContent=''}});$('send').onclick=()=>{const name=$('rName').value.trim(),pick=g=>document.querySelector(`.opt[data-g="${g}"].sel`)?.dataset.v||'',attend=pick('attend'),kids=pick('kids'),msg=$('rMsg').value.trim(),num=String(CONFIG.whatsapp).replace(/\D/g,'');if(!name){$('err').textContent='من فضلك اكتب اسمك';$('rName').focus();return}if(!attend){$('err').textContent='اختار هتحضر الفرح ولا لأ';return}if(!num){$('err').textContent='رقم واتساب غير مضبوط';return}const lines=[`تأكيد حضور فرح ${CONFIG.bride} و ${CONFIG.groom}`,`الاسم: ${name}`,`الحضور: ${attend}`];if(kids)lines.push(`معايا أطفال: ${kids}`);if(msg)lines.push(`التهنئة: ${msg}`);open(`https://wa.me/${num}?text=${encodeURIComponent(lines.join('\n'))}`,'_blank','noopener,noreferrer')};
let resizeTimer;addEventListener('resize',()=>{if(!revealed)return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{buildFlora();drawMap()},250)});
</script>

<script>
/* خريطة عالم أنظف مع قارات حقيقية مبسطة — بدون مكتبات خارجية */
function drawMap(){
  const cv = document.getElementById('map');
  const pin = document.getElementById('mpin');
  if (!cv || !pin) return;
​
  const W = 320, H = 190;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = W * dpr;
  cv.height = H * dpr;
​
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
​
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#fffaf6');
  bg.addColorStop(.55, '#f8ebe3');
  bg.addColorStop(1, '#efd8cc');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
​
  // خطوط طول وعرض خفيفة
  g.save();
  g.strokeStyle = 'rgba(176,113,79,.10)';
  g.lineWidth = .7;
  [38, 76, 114, 152].forEach(y => {
    g.beginPath();
    g.moveTo(10, y);
    g.bezierCurveTo(90, y - 7, 230, y - 7, 310, y);
    g.stroke();
  });
  [54, 107, 160, 213, 266].forEach(x => {
    g.beginPath();
    g.moveTo(x, 12);
    g.bezierCurveTo(x - 16, 62, x - 16, 128, x, 178);
    g.stroke();
  });
  g.restore();
​
  // مسارات مبسطة للقارات
  const continents = [
    // أمريكا الشمالية
    [[17,49],[30,30],[55,21],[84,25],[102,39],[98,53],[84,58],[78,70],[63,73],[54,87],[41,81],[37,68],[24,62]],
    // جرينلاند
    [[91,16],[110,9],[125,18],[119,34],[103,37],[94,28]],
    // أمريكا الجنوبية
    [[76,88],[91,84],[105,96],[110,116],[103,139],[91,163],[81,151],[77,131],[68,108]],
    // أوروبا وآسيا
    [[135,42],[149,30],[171,28],[187,18],[216,21],[235,30],[262,29],[287,42],[301,57],[288,68],[270,66],[258,77],[237,74],[224,85],[205,78],[192,66],[174,69],[161,60],[146,63],[135,54]],
    // أفريقيا
    [[145,71],[165,64],[185,72],[197,91],[190,117],[178,143],[161,137],[151,119],[143,97],[134,83]],
    // الهند وجنوب شرق آسيا
    [[206,80],[219,83],[225,101],[218,116],[209,103],[201,91]],
    [[244,79],[260,83],[271,94],[261,102],[248,96]],
    // أستراليا
    [[250,127],[267,116],[290,120],[302,136],[291,151],[267,153],[252,143]],
    // اليابان ومدغشقر ونيوزيلندا
    [[290,73],[294,81],[291,90]],[[201,132],[205,147],[201,158]],[[306,150],[312,161],[307,171]]
  ];
​
  // ظل القارات
  g.save();
  g.translate(0, 2);
  g.fillStyle = 'rgba(58,20,9,.08)';
  continents.forEach(points => drawPolygon(g, points));
  g.restore();
​
  const land = g.createLinearGradient(70, 20, 240, 160);
  land.addColorStop(0, '#7b3924');
  land.addColorStop(.48, '#5a2415');
  land.addColorStop(1, '#3d160d');
  g.fillStyle = land;
  continents.forEach(points => drawPolygon(g, points));
​
  // نقط ذهبية دقيقة تعطي إحساس فاخر
  g.save();
  g.fillStyle = 'rgba(233,207,156,.48)';
  const dots = [[46,48],[70,39],[89,52],[86,107],[94,129],[156,49],[180,43],[210,38],[241,48],[273,52],[163,89],[174,112],[270,134],[286,139]];
  dots.forEach(([x,y],i) => {
    g.beginPath();
    g.arc(x,y,i%3===0?1.4:1,0,Math.PI*2);
    g.fill();
  });
  g.restore();
​
  // اسم مصر على الخريطة
  g.fillStyle = 'rgba(74,26,13,.72)';
  g.font = "700 10px 'Tajawal', sans-serif";
  g.textAlign = 'center';
  g.fillText('مصر', 181, 81);
​
  pin.style.left = '56.6%';
  pin.style.top = '44%';
}
​
function drawPolygon(ctx, points){
  ctx.beginPath();
  points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();
  ctx.fill();
}
​
drawMap();
</script>
